name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Baseline migration matches the documented schema
        run: diff -u docs/schema.sql api/migrations/versions/0001_baseline.sql

      - name: Start the stack (Postgres, Redis, MinIO, API, worker)
        run: docker compose up -d --build --wait

      - name: Lint
        run: docker compose exec -T api ruff check .

      - name: Formatting
        run: docker compose exec -T api ruff format --check .

      - name: Tests
        run: docker compose exec -T api pytest

      - name: The production image builds and its settings check works
        run: |
          docker build --build-arg REQUIREMENTS=requirements.txt -t reelforge-api:prod api
          # With development settings the production app must refuse to start.
          if docker run --rm -e ENV=production reelforge-api:prod python -c "import wsgi"; then
            echo "production started with development secrets" && exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
