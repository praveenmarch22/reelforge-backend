# Local development stack: database, queue, file storage, API and worker.
#
#   docker compose up -d --build     start everything
#   docker compose exec api pytest   run the tests
#   docker compose down              stop (add -v to also delete local data)
#
# The passwords below are for local development only. Real environments get theirs
# from a secrets store; see docs/TECHNICAL_DESIGN.md (Security, Deployment).

x-api-env: &api-env
  ENV: development
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
  DATABASE_URL: postgresql+psycopg://reelforge:reelforge@postgres:5432/reelforge
  TEST_DATABASE_URL: postgresql+psycopg://reelforge:reelforge@postgres:5432/reelforge_test
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
  S3_BUCKET: reelforge-media
  S3_ACCESS_KEY: reelforge-dev
  S3_SECRET_KEY: reelforge-dev-secret
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
  # Emails go to the local test inbox (Mailpit): http://localhost:8025
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
  # Language models (scripts, ideas). "mock" answers offline until real keys are in .env;
  # then set LLM_PROVIDERS=gemini,groq there.
  LLM_PROVIDERS: ${LLM_PROVIDERS:-mock}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  # Voiceovers: ElevenLabs first once its key is in .env (without a key it is skipped), then
  # the free Edge voices, which need no key. "mock" makes a tone offline.
  VOICE_PROVIDERS: ${VOICE_PROVIDERS:-elevenlabs,edge}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
  # Visuals: stock clips from Pixabay, AI images from FLUX on Cloudflare Workers AI. Without
  # their keys in .env they are skipped and visuals answer "not available"; set
  # STOCK_PROVIDERS=mock and IMAGE_PROVIDERS=mock there to work offline.
  STOCK_PROVIDERS: ${STOCK_PROVIDERS:-pixabay}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  IMAGE_PROVIDERS: ${IMAGE_PROVIDERS:-cloudflare}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  # Publishing (B6): YouTube with the OAuth client from .env; "mock" works offline without it.
  PUBLISH_PROVIDERS: ${PUBLISH_PROVIDERS:-youtube}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:5173/api/v1/connections/youtube/callback}
  # Empty = the development key built into the settings; production must set its own.
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-ZGV2LW9ubHktdG9rZW4ta2V5LWNoYW5nZS1tZS0wMDA=}
  # The render service below; the worker starts renders there and polls their progress.
  RENDER_SERVICE_URL: ${RENDER_SERVICE_URL:-http://renderer:3000}
  RENDER_SERVICE_TOKEN: dev-only-render-token
  # A developer's machine draws about 0.85 frames a second at 720x1280, so a 90 s Reel needs
  # about 53 minutes: 90 minutes allowed locally (production keeps its measured default).
  RENDER_TIME_LIMIT_SECONDS: ${RENDER_TIME_LIMIT_SECONDS:-5400}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reelforge
      POSTGRES_PASSWORD: reelforge
      POSTGRES_DB: reelforge
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelforge -d reelforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes its own images on Docker Hub or Quay, so this is Chainguard's
    # build of MinIO, pinned by digest (RELEASE.2026-11-23). It has no shell, so there is no
    # health check here; `flask storage-init` waits for it instead.
    image: cgr.dev/chainguard/minio@sha256:bd92a45b821c0d85772c607ed7b49693efe78b3ffffae301b5d1b0981660de22
    command: server /data --console-address ":9001"
    user: "0:0" # local only: lets it write to the Docker volume
    environment:
      MINIO_ROOT_USER: reelforge-dev
      MINIO_ROOT_PASSWORD: reelforge-dev-secret
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  mailpit:
    # A test inbox: it accepts every email the API sends and shows it in a web page.
    # Nothing is delivered to real addresses.
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"

  api:
    build: ./api
    environment: *api-env
    # Development: apply migrations, make sure the bucket exists, then run with auto-reload.
    # The in-browser debugger is off: it lets anyone who can reach the port run code.
    command: >
      sh -c "flask db upgrade && flask storage-init &&
             flask run --host 0.0.0.0 --port 5000 --debug --no-debugger"
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - ./api:/app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build: ./api
    environment: *api-env
    # -B also runs the scheduler for the daily housekeeping tasks. In real environments the
    # scheduler is its own single process, so two workers never both schedule the same task.
    command: celery -A wsgi:celery_app worker -B -s /tmp/celerybeat-schedule --loglevel INFO --concurrency 2 -Q default,llm,voice,visuals,ai_video,maintenance
    volumes:
      - ./api:/app
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # Asks this worker to answer; fails if it crashed or can't reach the queue.
      test: ["CMD-SHELL", "celery -A wsgi:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s

  render-worker:
    # Renders only, one at a time like the render service, so a long render never holds up
    # other jobs (QB5-002). Its tasks mostly wait for the service.
    build: ./api
    environment: *api-env
    command: celery -A wsgi:celery_app worker -n render@%h --loglevel INFO --concurrency 1 --prefetch-multiplier 1 -Q render
    volumes:
      - ./api:/app
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # Answers while a render runs: Celery replies from its main process, not the busy slot.
      test: ["CMD-SHELL", "celery -A wsgi:celery_app inspect ping -d render@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s

  publish-worker:
    # Publishing only: an upload and YouTube's processing can take many minutes, mostly
    # waiting, so they never hold up scripts, voices and visuals (QB6-010).
    build: ./api
    environment: *api-env
    command: celery -A wsgi:celery_app worker -n publish@%h --loglevel INFO --concurrency 2 --prefetch-multiplier 1 -Q publish
    volumes:
      - ./api:/app
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A wsgi:celery_app inspect ping -d publish@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s

  renderer:
    # Turns a timeline into the finished MP4 with Remotion (headless Chrome and FFmpeg).
    # It downloads files from storage at its internal address and uploads the result to
    # links made for each render, so it holds no storage keys.
    build: ./renderer
    shm_size: 1gb # Chrome needs more shared memory than Docker's 64 MB default
    environment:
      RENDER_SERVICE_TOKEN: dev-only-render-token
      # Local renders come out at 720x1280, about twice as fast; production renders 1080x1920.
      RENDER_SCALE: "${RENDER_SCALE:-2/3}"
      # Only files from local storage are downloaded or uploaded to (QB5-008).
      RENDER_ALLOWED_ORIGINS: http://minio:9000
    ports:
      - "127.0.0.1:${RENDERER_PORT:-3100}:3000"

volumes:
  postgres-data:
  minio-data:
