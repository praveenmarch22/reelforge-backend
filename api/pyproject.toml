[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test-only secrets

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest-cache"
addopts = "-ra"
markers = ["worker: needs a running Celery worker"]
filterwarnings = [
    # From libraries, not our code: botocore's utcnow() and Flask-Migrate's generated env.py.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:botocore",
    "ignore:'get_engine' is deprecated:DeprecationWarning",
]
